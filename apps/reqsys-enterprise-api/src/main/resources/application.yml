server:
  port: 8081

spring:
  application:
    name: reqsys-enterprise-api
  datasource:
    url: jdbc:sqlserver://${SQLSERVER_HOST:localhost}:${SQLSERVER_PORT:1433};databaseName=${SQLSERVER_DATABASE:reqsys};encrypt=true;trustServerCertificate=true
    username: ${SQLSERVER_USERNAME:sa}
    password: ${SQLSERVER_PASSWORD:YourStrong!Passw0rd}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

redmine:
  base-url: ${REDMINE_BASE_URL:https://redmine-c5i6.onrender.com}
  api-key:  ${REDMINE_API_KEY:}
  project-id: ${REDMINE_PROJECT_ID:reqsys}

logging:
  level:
    root: INFO
    br.com.reqsys: DEBUG
