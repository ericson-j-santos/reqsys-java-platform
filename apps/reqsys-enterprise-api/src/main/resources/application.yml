server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: reqsys-enterprise-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://${SQLSERVER_HOST:localhost}:${SQLSERVER_PORT:1433};databaseName=${SQLSERVER_DATABASE:reqsys};encrypt=true;trustServerCertificate=false}
    username: ${SQLSERVER_USERNAME:}
    password: ${SQLSERVER_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

redmine:
  base-url: ${REDMINE_BASE_URL:}
  api-key: ${REDMINE_API_KEY:}
  project-id: ${REDMINE_PROJECT_ID:reqsys}

reqsys:
  security:
    enabled: ${REQSYS_AUTH_ENABLED:true}
    jwt:
      audiences: ${JWT_AUDIENCES:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  cofre:
    token: ${REQSYS_COFRE_TOKEN:}

logging:
  level:
    root: INFO
    br.com.reqsys: INFO
