spring:
  datasource:
    url: "jdbc:h2:file:./data/reqsys-local;INIT=CREATE SCHEMA IF NOT EXISTS DBO;DB_CLOSE_DELAY=-1"
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

reqsys:
  cofre:
    token:
    seed-local: true

logging:
  level:
    br.com.reqsys: DEBUG
