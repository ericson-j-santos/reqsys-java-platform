server:
  port: 8083

spring:
  application:
    name: planner-teams-status-worker
  datasource:
    url: jdbc:sqlserver://${SQLSERVER_HOST:localhost}:${SQLSERVER_PORT:1433};databaseName=${SQLSERVER_DATABASE:reqsys};encrypt=true;trustServerCertificate=true
    username: ${SQLSERVER_USERNAME:sa}
    password: ${SQLSERVER_PASSWORD:YourStrong!Passw0rd}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

reqsys:
  microsoft:
    graph:
      tenant-id: ${REQSYS_GRAPH_TENANT_ID:}
      client-id: ${REQSYS_GRAPH_CLIENT_ID:}
      client-secret: ${REQSYS_GRAPH_CLIENT_SECRET:}
      graph-base-url: ${REQSYS_GRAPH_BASE_URL:https://graph.microsoft.com/v1.0}
      scope: ${REQSYS_GRAPH_SCOPE:https://graph.microsoft.com/.default}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    br.com.reqsys: DEBUG
