server:
  port: 8084

spring:
  application:
    name: cadastra-pf-siopi-api
  datasource:
    url: jdbc:sqlserver://${SQLSERVER_HOST:localhost}:${SQLSERVER_PORT:1433};databaseName=${SQLSERVER_DATABASE:reqsys};encrypt=true;trustServerCertificate=true
    username: ${SQLSERVER_USERNAME:sa}
    password: ${SQLSERVER_PASSWORD:YourStrong!Passw0rd}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    br.com.reqsys: DEBUG
