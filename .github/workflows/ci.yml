name: ci

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-test-scan:
    name: Build, testes e security gates
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven verify módulos afetados
        run: mvn -B -pl apps/reqsys-enterprise-api -am clean verify

      - name: OWASP Dependency-Check módulos afetados
        run: mvn -B -pl apps/reqsys-enterprise-api -am org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9 -Dformat=HTML -Dformat=JSON

      - name: Gerar SBOM CycloneDX módulos afetados
        run: mvn -B -pl apps/reqsys-enterprise-api -am org.cyclonedx:cyclonedx-maven-plugin:2.8.0:makeAggregateBom

      - name: Instalar Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy filesystem scan
        run: trivy fs --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 .

      - name: Build Docker image
        run: docker build -t reqsys-enterprise-api:${{ github.sha }} .

      - name: Trivy image scan
        run: trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 reqsys-enterprise-api:${{ github.sha }}

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            target/bom.*
            **/target/bom.*
          if-no-files-found: warn

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.*
            **/target/dependency-check-report.*
          if-no-files-found: warn
