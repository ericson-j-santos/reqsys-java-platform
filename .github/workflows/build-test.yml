name: build-test

on:
  push:
    branches: [ main, dev, develop ]
  pull_request:
    branches: [ main, dev, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify -Dmaven.test.skip=true
      - name: Upload cofre JAR
        uses: actions/upload-artifact@v4
        with:
          name: reqsys-enterprise-api-jar
          path: apps/reqsys-enterprise-api/target/reqsys-enterprise-api-*.jar
          retention-days: 7
